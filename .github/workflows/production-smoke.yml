name: HGS production smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "lib/**"
      - "middleware.js"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Wait for matching Vercel deployment
        shell: bash
        run: |
          set +e
          BASE="https://hgs-control-center.vercel.app"
          matched=0
          deployment_sha=""
          for i in {1..30}; do
            body=$(curl -L -sS --connect-timeout 10 --max-time 20 "$BASE/api/health")
            sha=$(printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("gitSha") or "")' 2>/dev/null)
            deployment_sha="$sha"
            echo "poll=$i health_sha=$sha workflow_sha=$GITHUB_SHA event=$GITHUB_EVENT_NAME"
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$sha" ]; then
              # Manual acceptance runs validate the currently assigned production
              # deployment. The branch head may be a report-only commit that Vercel
              # intentionally skipped via ignoreCommand.
              matched=1
              break
            fi
            if [ "$sha" = "$GITHUB_SHA" ]; then matched=1; break; fi
            sleep 10
          done
          echo "matched=$matched" >> "$GITHUB_ENV"
          echo "deployment_sha=$deployment_sha" >> "$GITHUB_ENV"

      - name: Probe production and save report
        shell: bash
        run: |
          set +e
          BASE="https://hgs-control-center.vercel.app"
          REPORT="reports/production-smoke-latest.md"
          mkdir -p reports
          {
            echo "# HGS Production Smoke"
            echo
            echo "- tested_at_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- workflow_commit: $GITHUB_SHA"
            echo "- deployment_commit: ${deployment_sha:-unknown}"
            echo "- matched_current_deployment: ${matched:-0}"
            echo "- base: $BASE"
            echo
          } > "$REPORT"

          probe_get () {
            path="$1"
            rm -f /tmp/b
            code=$(curl -L -sS --connect-timeout 15 --max-time 30 -o /tmp/b -w "%{http_code}" "$BASE$path")
            ec=$?
            {
              echo "## GET $path"
              echo
              echo "- curl_exit: $ec"
              echo "- http_status: $code"
              echo
              echo '~~~'
              head -c 5000 /tmp/b 2>/dev/null || true
              echo
              echo '~~~'
              echo
            } >> "$REPORT"
          }

          probe_post () {
            path="$1"
            data="$2"
            rm -f /tmp/b
            code=$(curl -L -sS --connect-timeout 15 --max-time 30 -o /tmp/b -w "%{http_code}" -H "Content-Type: application/json" --data "$data" "$BASE$path")
            ec=$?
            {
              echo "## POST $path"
              echo
              echo "- curl_exit: $ec"
              echo "- http_status: $code"
              echo
              echo '~~~'
              head -c 5000 /tmp/b 2>/dev/null || true
              echo
              echo '~~~'
              echo
            } >> "$REPORT"
          }

          probe_get "/"
          probe_get "/api/health"
          probe_get "/api/overview"
          probe_get "/api/integrations"
          probe_get "/api/commands"
          probe_post "/api/commands" '{"name":"Production E2E smoke","action":"REFRESH_DASHBOARD","priority":"低","externalImpact":"なし","approvalRequired":false,"readbackRequired":true,"requester":"GitHub Actions production smoke","payload":{"test":true,"source":"production-smoke"}}'
          probe_post "/api/metrics/ingest" '{"name":"smoke","key":"smoke","value":1,"unit":"count"}'
          probe_post "/api/webhooks/stripe" '{}'
          cat "$REPORT"

      - name: Commit smoke report
        shell: bash
        run: |
          git config user.name "hgs-smoke-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/production-smoke-latest.md
          if ! git diff --cached --quiet; then
            git commit -m "Record production smoke result [skip ci]"
            git push
          fi

      - name: Assert production readiness
        shell: bash
        run: |
          body=$(curl -L -sS --connect-timeout 10 --max-time 20 "https://hgs-control-center.vercel.app/api/health")
          ready=$(printf '%s' "$body" | python3 -c 'import json,sys; print("true" if json.load(sys.stdin).get("readyForOperations") else "false")' 2>/dev/null || echo false)
          echo "matched=${matched:-0} readyForOperations=$ready"
          test "${matched:-0}" = "1"
          test "$ready" = "true"
